<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Threat Actors — SENTINEL</title>
  <style>
    :root {
      --bg:#0a0c10;--surface:#111318;--surface2:#181c24;--border:#1e2430;--border2:#252d3d;
      --text:#e2e8f0;--text2:#8892a4;--text3:#4a5568;
      --green:#00d4a1;--green-dim:#00d4a120;--green-mid:#00d4a150;
      --red:#ff4757;--amber:#ffa502;--blue:#4ecdc4;--purple:#a78bfa;
      --font-mono:'IBM Plex Mono','Courier New',monospace;
      --font-sans:'Inter',system-ui,sans-serif;
    }
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:16px;line-height:1.6;}
    body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,212,161,0.015) 2px,rgba(0,212,161,0.015) 4px);pointer-events:none;z-index:1000;}
    nav{display:flex;align-items:center;gap:1rem;padding:0.875rem 2rem;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:100;}
    .nav-logo{font-family:var(--font-mono);font-size:17px;font-weight:600;color:var(--green);letter-spacing:0.15em;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
    .nav-logo::before{content:'◈';font-size:16px;animation:pulse 3s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
    .nav-links{display:flex;gap:1.5rem;margin-left:2rem;list-style:none;}
    .nav-links a{color:var(--text2);text-decoration:none;font-size:17px;transition:color 0.15s;}
    .nav-links a:hover,.nav-links a.active{color:var(--green);}
    main{padding:2rem;max-width:1400px;margin:0 auto;}
    .page-header{margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border);}
    .page-eyebrow{font-family:var(--font-mono);font-size:16px;color:var(--green);letter-spacing:0.2em;text-transform:uppercase;margin-bottom:0.5rem;}
    .page-title{font-size:28px;font-weight:600;margin-bottom:0.25rem;}
    .page-sub{font-size:17px;color:var(--text2);}
    .actor-detail{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:1.5rem;overflow:hidden;}
    .actor-detail-header{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;cursor:pointer;user-select:none;}
    .actor-detail-header:hover{background:var(--surface2);}
    .actor-header-left{}
    .actor-detail-name{font-size:21px;font-weight:600;margin-bottom:4px;}
    .actor-detail-aliases{font-size:16px;color:var(--text3);}
    .actor-header-right{display:flex;gap:0.75rem;align-items:center;flex-shrink:0;}
    .actor-big-score{font-family:var(--font-mono);font-size:28px;font-weight:600;}
    .tag{font-family:var(--font-mono);font-size:16px;padding:2px 8px;border-radius:3px;letter-spacing:0.05em;}
    .tag-ransomware{background:rgba(255,71,87,0.15);color:var(--red);border:1px solid rgba(255,71,87,0.3);}
    .tag-apt{background:rgba(167,139,250,0.15);color:var(--purple);border:1px solid rgba(167,139,250,0.3);}
    .tag-data_extortion{background:rgba(255,165,2,0.15);color:var(--amber);border:1px solid rgba(255,165,2,0.3);}
    .tag-supply_chain{background:rgba(78,205,196,0.15);color:var(--blue);border:1px solid rgba(78,205,196,0.3);}
    .tag-initial_access{background:rgba(0,212,161,0.15);color:var(--green);border:1px solid rgba(0,212,161,0.3);}
    .tag-raas{background:rgba(255,71,87,0.1);color:#ff6b6b;border:1px solid rgba(255,71,87,0.2);}
    .tag-nation_state{background:rgba(167,139,250,0.1);color:var(--purple);border:1px solid rgba(167,139,250,0.2);}
    .score-high{color:var(--red);}
    .score-med{color:var(--amber);}
    .score-low{color:var(--green);}
    .actor-detail-body{display:none;padding:1.5rem;}
    .actor-detail-body.open{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;}
    @media(max-width:800px){.actor-detail-body.open{grid-template-columns:1fr;}}
    .detail-section{margin-bottom:1.25rem;}
    .detail-label{font-family:var(--font-mono);font-size:16px;color:var(--text3);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:0.5rem;padding-bottom:0.375rem;border-bottom:1px solid var(--border);}
    .detail-text{font-size:17px;color:var(--text2);line-height:1.7;}
    .ttp-item{display:flex;gap:10px;margin-bottom:0.5rem;align-items:flex-start;}
    .ttp-id{font-family:var(--font-mono);font-size:17px;color:var(--green);min-width:80px;padding-top:1px;}
    .ttp-name{font-size:16px;font-weight:500;color:var(--text);}
    .ttp-notes{font-size:17px;color:var(--text3);}
    .pill-list{display:flex;flex-wrap:wrap;gap:6px;}
    .pill{font-size:16px;padding:3px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--border2);color:var(--text2);}
    .detect-item{font-size:16px;color:var(--text2);padding:0.375rem 0;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:flex-start;}
    .detect-item:last-child{border-bottom:none;}
    .detect-item::before{content:'⚡';font-size:16px;color:var(--green);padding-top:2px;flex-shrink:0;}
    .source-link{font-size:16px;color:var(--green);text-decoration:none;}
    .source-link:hover{text-decoration:underline;}
    .chevron{font-size:16px;color:var(--text3);transition:transform 0.2s;}
    .chevron.open{transform:rotate(90deg);}
    footer{margin-top:3rem;padding:1.5rem 2rem;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:17px;color:var(--text3);}
    footer a{color:var(--green);text-decoration:none;}
  </style>
</head>
<body>
<nav>
  <div class="nav-logo">SENTINEL</div>
  <ul class="nav-links">
    <li><a href="index.html">Dashboard</a></li>
    <li><a href="actors.html" class="active">Actors</a></li>
    <li><a href="trends.html">Tactics</a></li>
    <li><a href="attributor.html">Attributor</a></li>
    <li><a href="feed.html">Intel Feed</a></li>
  </ul>
</nav>
<main>
  <div class="page-header">
    <div class="page-eyebrow">Threat Intelligence</div>
    <div class="page-title">Tracked Threat Actors</div>
    <div class="page-sub">Click any actor to expand full profile — TTPs, detection opportunities, sources</div>
  </div>
  <div id="actors-container"><p style="color:var(--text3);font-size:17px;">Loading profiles...</p></div>
</main>
<footer>
  <div>SENTINEL · <a href="https://jogit91.github.io">Jake Ouellette</a></div>
  <div><a href="index.html">← Dashboard</a></div>
</footer>
<script>
const ACTOR_IDS = ['qilin','the-gentlemen','shinyhunters','teampcp','salt-typhoon','unc6692','lazarus','apt38','apt28','muddywater','mustang-panda','eviltokens','gamaredon','kimsuky','miasma','silver-fox','turla','apt37','black-basta'];

function scoreClass(s){return s>=85?'score-high':s>=70?'score-med':'score-low';}
function getTypeTag(type,model){
  let t=`<span class="tag tag-${type}">${type.replace('_',' ')}</span>`;
  if(model==='RaaS')t+=`<span class="tag tag-raas" style="margin-left:4px;">RaaS</span>`;
  if(model==='nation_state')t+=`<span class="tag tag-nation_state" style="margin-left:4px;">Nation-State</span>`;
  return t;
}

function renderActor(a){
  return `
  <div class="actor-detail" id="${a.id}">
    <div class="actor-detail-header" onclick="toggleActor('${a.id}')">
      <div class="actor-header-left">
        <div class="actor-detail-name">${a.name}</div>
        <div class="actor-detail-aliases">${a.aliases?.join(', ')||''} ${a.aliases?.length?'·':''} ${a.origin}</div>
        <div style="display:flex;gap:6px;margin-top:8px;">${getTypeTag(a.type,a.model)}</div>
      </div>
      <div class="actor-header-right">
        <div>
          <div class="actor-big-score ${scoreClass(a.activity_score)}">${a.activity_score}</div>
          <div style="font-family:var(--font-mono);font-size:16px;color:var(--text3);text-align:center;">activity</div>
        </div>
        <div style="font-family:var(--font-mono);font-size:16px;color:var(--text3);">
          <div>${a.mention_count_30d} mentions</div>
          <div>last 30d</div>
        </div>
        <span class="chevron" id="chev-${a.id}">▶</span>
      </div>
    </div>
    <div class="actor-detail-body" id="body-${a.id}">
      <div>
        <div class="detail-section">
          <div class="detail-label">Overview</div>
          <div class="detail-text">${a.description}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">TTPs (MITRE ATT&CK)</div>
          ${a.ttps.map(t=>`
            <div class="ttp-item">
              <div class="ttp-id">${t.technique_id}</div>
              <div>
                <div class="ttp-name">${t.technique_name}</div>
                <div class="ttp-notes">${t.notes}</div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="detail-section">
          <div class="detail-label">Detection Opportunities</div>
          ${a.detection_opportunities.map(d=>`<div class="detect-item">${d}</div>`).join('')}
        </div>
      </div>
      <div>
        <div class="detail-section">
          <div class="detail-label">Targeted Sectors</div>
          <div class="pill-list">${a.targeted_sectors.map(s=>`<span class="pill">${s}</span>`).join('')}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">Targeted Regions</div>
          <div class="pill-list">${a.targeted_regions.map(r=>`<span class="pill">${r}</span>`).join('')}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">Motivation</div>
          <div class="pill-list">${a.motivation.map(m=>`<span class="pill">${m.replace('_',' ')}</span>`).join('')}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">Malware / Tools</div>
          <div class="pill-list">${a.malware_families.length?a.malware_families.map(m=>`<span class="pill">${m}</span>`).join(''):'<span style="color:var(--text3);font-size:16px;">None identified / LOTL</span>'}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">Notable Techniques</div>
          ${a.notable_techniques.map(n=>`<div class="detect-item">${n}</div>`).join('')}
        </div>
        <div class="detail-section">
          <div class="detail-label">Sources</div>
          ${a.sources.map(s=>`<div style="margin-bottom:4px;"><a class="source-link" href="${s.url}" target="_blank">↗ ${s.title}</a></div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

function toggleActor(id){
  const body = document.getElementById('body-'+id);
  const chev = document.getElementById('chev-'+id);
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open',!isOpen);
  chev.classList.toggle('open',!isOpen);
}

async function loadActors(){
  const container = document.getElementById('actors-container');
  const profiles = await Promise.allSettled(
    ACTOR_IDS.map(id =>
      fetch(`https://raw.githubusercontent.com/JOGit91/sentinel/main/data/actors/${id}.json`)
        .then(r=>r.ok?r.json():fetch(`../data/actors/${id}.json`).then(r2=>r2.json()))
    )
  );
  const actors = profiles.filter(r=>r.status==='fulfilled').map(r=>r.value)
    .sort((a,b)=>b.activity_score-a.activity_score);

  if(!actors.length){container.innerHTML='<p style="color:var(--text3)">Could not load actor data.</p>';return;}
  container.innerHTML = actors.map(renderActor).join('');

  // Auto-expand if hash matches
  const hash = window.location.hash?.slice(1);
  if(hash && ACTOR_IDS.includes(hash)) toggleActor(hash);
}

loadActors();
</script>
</body>
</html>
